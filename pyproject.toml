[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gorani-upload"
version = "0.4.0"
description = "Upload-side image storage service for image.gorani.me"
requires-python = ">=3.11"
dependencies = [
    "Pillow==13.0.0",
    "python-multipart==0.0.32",
]

[project.scripts]
image-upload = "upload_service.__main__:main"

[tool.setuptools.packages.find]
include = ["upload_service*"]
